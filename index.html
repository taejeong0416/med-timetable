<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>의대 시간표</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eceff1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시간표">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hdr" hidden>
    <div class="hbtns">
      <button class="mail" id="mail" aria-label="편지" hidden>
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.5" y="4.5" width="15" height="11" rx="2.5"/>
          <path d="M3.4 6.2 10 11l6.6-4.8"/>
        </svg><i></i>
      </button>
      <button class="gear" id="gear" aria-label="설정">설정</button>
    </div>
    <div class="title" id="hTitle"></div>
    <div class="subtitle" id="hSub"></div>
  </header>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<input type="file" id="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>

<script src="vendor/xlsx.full.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
